<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Güven & Analiz Testi 🎭</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #022c22; color: white; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 overflow-hidden relative">

  <!-- Arka Plan Süzülen Işıklar -->
  <div class="absolute w-72 h-72 bg-emerald-500/20 rounded-full blur-3xl -top-10 -left-10 animate-pulse"></div>
  <div class="absolute w-72 h-72 bg-teal-500/20 rounded-full blur-3xl -bottom-10 -right-10 animate-pulse"></div>

  <!-- Ana Kart -->
  <div id="card" class="glass w-full max-w-md p-8 rounded-3xl text-center shadow-2xl relative z-10">
    
    <!-- Step 1: İsim Alma -->
    <div id="step1">
      <div class="text-4xl mb-3">🤖</div>
      <h1 class="text-2xl font-bold mb-2">AI Güven Analizi</h1>
      <p class="text-white/60 text-sm mb-6">Yapay zeka veritabanı üzerinden arkadaşlık katsayını analiz ediyoruz.</p>
      
      <input id="userName" type="text" placeholder="Adını ve Soyadını Yaz..." class="w-full bg-white/10 border border-white/20 rounded-2xl p-4 mb-4 text-white text-center focus:outline-none focus:border-emerald-400 placeholder-white/30">
      
      <button onclick="startAnalysis()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-4 rounded-2xl transition-all shadow-lg shadow-emerald-500/30 active:scale-95">
        Analizi Başlat 🚀
      </button>
    </div>

    <!-- Step 2: Tarama Yükleniyor -->
    <div id="step2" class="hidden">
      <div class="w-16 h-16 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
      <h2 class="text-xl font-bold mb-2">Veriler Taranıyor...</h2>
      <p id="loadingText" class="text-emerald-400 text-sm font-mono">Sosyal medya geçmişi çekiliyor...</p>
    </div>

    <!-- Step 3: Sonuç (Troll Ekranı) -->
    <div id="step3" class="hidden">
      <div class="text-5xl mb-3">⚠️</div>
      <h2 id="resultTitle" class="text-2xl font-bold text-red-400 mb-2">KRİTİK UYARI!</h2>
      <div class="bg-red-500/10 border border-red-500/30 rounded-2xl p-4 my-4 text-left text-sm space-y-2">
        <p><strong>Hedef:</strong> <span id="targetName" class="text-emerald-300"></span></p>
        <p><strong>Güvenilirlik Skoru:</strong> <span class="text-red-400 font-bold">%12 (Aşırı Tehlikeli)</span></p>
        <p><strong>AI Tespiti:</strong> <span id="trollText" class="text-white/80"></span></p>
      </div>
      <button onclick="location.reload()" class="w-full bg-white/10 hover:bg-white/20 py-3 rounded-xl text-xs font-semibold">
        Sistemi Yeniden Başlat
      </button>
    </div>

  </div>

  <script>
    const trollMessages = [
      "Bu kişi gruptaki tüm dedikoduları ilk yayan kişidir. Borç istenirse anında 'kanka cüzdanı evde unuttum' der.",
      "Yapay zeka analizine göre bu arkadaşın en büyük hobisi plan yapıp son 5 dakika kala 'kanka ben gelemiyorum' demektir.",
      "Son görülen verilerine göre mesajlara 6 saat sonra 'aaaa yeni gördüm kanka' yazma oranı %98.2'dir.",
      "İnanılmaz derecede güvenilmez! Ismarladığı çayın bile hesabını 3 ay boyunca aklında tutar."
    ];

    function startAnalysis() {
      const name = document.getElementById('userName').value.trim();
      if (!name) return alert('Lütfen adını yaz aga!');

      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');

      const texts = [
        "Galeri fotoğrafları taranıyor...",
        "WhatsApp grup geçmişi inceleniyor...",
        "Gözlemlenen gizli davranışlar hesaplanıyor...",
        "Sonuç hazırlanıyor..."
      ];

      let i = 0;
      const interval = setInterval(() => {
        if (i < texts.length) {
          document.getElementById('loadingText').innerText = texts[i];
          i++;
        } else {
          clearInterval(interval);
          showResult(name);
        }
      }, 1000);
    }

    function showResult(name) {
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.remove('hidden');
      
      document.getElementById('targetName').innerText = name;
      // Rastgele bir troll mesajı seç
      const randomTroll = trollMessages[Math.floor(Math.random() * trollMessages.length)];
      document.getElementById('trollText').innerText = randomTroll;
    }
  </script>
</body>
</html>
